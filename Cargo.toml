[package]
name = "rs_stream"
version = "0.1.0"
edition = "2024"

[dependencies]
allocator-api2 =            { version = "=0.3.1", default-features = false, features = ["alloc"] }
critical-section =          { version = "=1.2.0" }
embassy-executor =          { version = "=0.10.0" }
embassy-time =              { version = "=0.5.1" }
# aligned =                   { version = "=0.4.3" }
embedded-hal =              { version = "=1.0.0" }
esp-alloc =                 { version = "=0.11.0" }
esp-backtrace =             { version = "=0.20.0", features = ["panic-handler", "println"] }
esp-bootloader-esp-idf =    { version = "=0.6.0" }
esp-hal =                   { version = "=1.2.0", features = ["unstable", "log-04"] }
esp-hal-procmacros =        { version = "=0.23.0", package = "esp-hal-procmacros" }
esp-println =               { version = "=0.18.0", features = ["log-04"] }
esp-rtos =                  { version = "=0.4.0", features = ["embassy"] }
log =                       { version = "=0.4.34" }

[patch.crates-io]
esp-bootloader-esp-idf = { path = "../esp-hal/esp-bootloader-esp-idf" }
esp-hal = { path = "../esp-hal/esp-hal" }
esp-rtos = { path = "../esp-hal/esp-rtos" }

[features]
default = ["esp32s3"]

esp32s3 = [
    "esp-alloc/esp32s3",
    "esp-backtrace/esp32s3",
    "esp-bootloader-esp-idf/esp32s3",
    "esp-hal/esp32s3",
    "esp-println/esp32s3",
    "esp-rtos/esp32s3",
]

[profile.dev]
opt-level = 0
debug = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
codegen-units = 1
debug = false
